# Broker desk: Dhan TOE only. Hosts come from UPSTREAM environment variables at container start.
# This file does not reference mock TOE.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /pnl/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /pnl/sounds/ {
    alias /usr/share/nginx/html/sounds/;
  }

  location /pnl/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /_desk_auth {
    internal;
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /_setup_auth {
    internal;
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/setup-gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/login {
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  location = /api/auth/status {
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/status;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  location = /pnl/api/auth/login {
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  location = /pnl/api/auth/status {
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/status;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  location /health {
    proxy_pass http://${UPSTREAM_BACKEND}/health;
    proxy_set_header Host $host;
  }

  # Subpath hosting (VITE_BASE_PATH=/pnl) — browser calls /pnl/api, not /api
  location /pnl/health {
    proxy_pass http://${UPSTREAM_BACKEND}/health;
    proxy_set_header Host $host;
  }

  # Portfolio Generator (optimize / frontier can be CPU-heavy)
  location /api/portfolio/ {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_PORTFOLIO}/api/portfolio/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    client_max_body_size 5m;
  }

  location /pnl/api/portfolio/ {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_PORTFOLIO}/api/portfolio/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    client_max_body_size 5m;
  }

  location /api/ {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_BACKEND}/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location /pnl/api/ {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_BACKEND}/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location /rms/ {
    auth_request /_setup_auth;
    proxy_pass http://${UPSTREAM_RMS}/rms/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /pnl/rms/config {
    error_page 418 = @pnl_rms_config_write;
    if ($request_method != GET) {
        return 418;
    }
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_RMS}/rms/config;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @pnl_rms_config_write {
    internal;
    auth_request /_setup_auth;
    rewrite ^ /rms/config break;
    proxy_pass http://${UPSTREAM_RMS};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /pnl/rms/strategies/bulk-toggle {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_RMS}/rms/strategies/bulk-toggle;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /pnl/rms/config/limits {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_RMS}/rms/config/limits;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /pnl/rms/ {
    auth_request /_setup_auth;
    proxy_pass http://${UPSTREAM_RMS}/rms/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /toe-dhan/ {
    auth_request /_setup_auth;
    proxy_pass http://${UPSTREAM_TOE_DHAN}/toe/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /pnl/toe-dhan/ {
    auth_request /_setup_auth;
    proxy_pass http://${UPSTREAM_TOE_DHAN}/toe/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /pnl/toe-kotak/ {
    auth_request /_setup_auth;
    proxy_pass http://${UPSTREAM_TOE_KOTAK}/toe/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_BACKEND}/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /pnl/ws {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_BACKEND}/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
}
