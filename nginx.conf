# Both TOE routes. Hosts come from UPSTREAM environment variables at container start.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /pnl/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /pnl/ {
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Backend
  location /health {
    proxy_pass http://${UPSTREAM_BACKEND}/health;
    proxy_set_header Host $host;
  }

  location /pnl/health {
    proxy_pass http://${UPSTREAM_BACKEND}/health;
    proxy_set_header Host $host;
  }

  # Portfolio Generator (optimize / frontier can be CPU-heavy)
  location /api/portfolio/ {
    proxy_pass http://${UPSTREAM_PORTFOLIO}/api/portfolio/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    client_max_body_size 5m;
  }

  location /pnl/api/portfolio/ {
    proxy_pass http://${UPSTREAM_PORTFOLIO}/api/portfolio/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    client_max_body_size 5m;
  }

  location /api/ {
    proxy_pass http://${UPSTREAM_BACKEND}/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location /pnl/api/ {
    proxy_pass http://${UPSTREAM_BACKEND}/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  # RMS / TOE HTTP APIs
  location /rms/ {
    proxy_pass http://${UPSTREAM_RMS}/rms/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /pnl/rms/ {
    proxy_pass http://${UPSTREAM_RMS}/rms/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /toe/ {
    proxy_pass http://${UPSTREAM_TOE}/toe/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /pnl/toe/ {
    proxy_pass http://${UPSTREAM_TOE}/toe/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /toe-dhan/ {
    proxy_pass http://${UPSTREAM_TOE_DHAN}/toe/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /pnl/toe-dhan/ {
    proxy_pass http://${UPSTREAM_TOE_DHAN}/toe/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket to Backend (/ws)
  location /ws {
    proxy_pass http://${UPSTREAM_BACKEND}/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /pnl/ws {
    proxy_pass http://${UPSTREAM_BACKEND}/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
}

