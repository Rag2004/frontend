# Mock desk: mock TOE only. Hosts come from UPSTREAM environment variables at container start.
# This file does not reference toe_dhan.
# Caddy terminates TLS and sets X-Forwarded-Proto. Use that when present.
map $http_x_forwarded_proto $forwarded_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite base=/pnl/ — built files live in /assets/ but URLs are /pnl/assets/
  location /pnl/assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /pnl/ {
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /_desk_auth {
    internal;
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /_setup_auth {
    internal;
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/setup-gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /api/auth/login {
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Cookie $http_cookie;
  }

  location = /api/auth/status {
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/status;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Cookie $http_cookie;
  }

  location = /pnl/api/auth/login {
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Cookie $http_cookie;
  }

  location = /pnl/api/auth/status {
    proxy_pass http://${UPSTREAM_BACKEND}/api/auth/status;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Cookie $http_cookie;
  }

  location /health {
    proxy_pass http://${UPSTREAM_BACKEND}/health;
    proxy_set_header Host $host;
  }

  # Subpath hosting (VITE_BASE_PATH=/pnl) — browser calls /pnl/api, not /api
  location /pnl/health {
    proxy_pass http://${UPSTREAM_BACKEND}/health;
    proxy_set_header Host $host;
  }

  # Portfolio Generator (optimize / frontier can be CPU-heavy)
  location /api/portfolio/ {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_PORTFOLIO}/api/portfolio/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    client_max_body_size 5m;
  }

  location /pnl/api/portfolio/ {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_PORTFOLIO}/api/portfolio/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    client_max_body_size 5m;
  }

  location /api/ {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_BACKEND}/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location /pnl/api/ {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_BACKEND}/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location /rms/ {
    auth_request /_setup_auth;
    proxy_pass http://${UPSTREAM_RMS}/rms/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /pnl/rms/ {
    auth_request /_setup_auth;
    proxy_pass http://${UPSTREAM_RMS}/rms/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /toe/ {
    auth_request /_setup_auth;
    proxy_pass http://${UPSTREAM_TOE}/toe/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /pnl/toe/ {
    auth_request /_setup_auth;
    proxy_pass http://${UPSTREAM_TOE}/toe/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /ws {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_BACKEND}/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /pnl/ws {
    auth_request /_desk_auth;
    proxy_pass http://${UPSTREAM_BACKEND}/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
}
